[package]
name = "wg-vpng-node"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "wg-vpng-node"
path = "src/main.rs"

[dependencies]
wg-backend = { path = "../wg-backend" }
axum = "0.8"
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
toml = "0.8"
anyhow = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[dev-dependencies]
async-trait = "0.1"
