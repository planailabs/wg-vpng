[package]
name = "wg-backend"
version = "0.1.0"
edition = "2021"

# Shared WireGuard reconcile backends + wire types, used by both the main server
# (which drives them, including the remote `node` backend) and the `node` agent
# (which applies them locally on a remote box).

[dependencies]
async-trait = "0.1"
tokio = { version = "1", features = ["process", "fs", "io-util", "rt"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
schemars = { version = "1.2", features = ["derive"] }
thiserror = "2"
reqwest = { workspace = true }
mikrotik-api = { path = "../mikrotik-api" }

[dev-dependencies]
tokio = { version = "1", features = ["full"] }
axum = "0.8"
