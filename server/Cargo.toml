[package]
name = "wg-vpng-server"
version = "0.1.0"
edition = "2024"
default-run = "wg-vpng-server"

[[bin]]
name = "wg-vpng-server"
path = "src/main.rs"

[features]
default = ["web", "server", "webui"]
web = ["webui", "dioxus/web", "dep:wasm-bindgen"]
webui = [
    "dep:dioxus",
    "dep:dioxus-i18n",
    "dep:unic-langid",
    "dep:plan-ai-design",
]
server = [
    "webui",
    "dioxus/server",
    "dep:axum",
    "dep:tower",
    "dep:tokio",
    "dep:sqlx",
    "dep:async-trait",
    "dep:anyhow",
    "dep:thiserror",
    "dep:toml",
    "dep:tracing",
    "dep:tracing-subscriber",
    "dep:rustls",
    "dep:x25519-dalek",
    "dep:rand",
    "dep:base64",
    "dep:ipnet",
    "dep:sha2",
    "dep:aes-gcm",
    "dep:qrcode",
    "dep:plan-ai-html",
    "dep:plan-ai-api-mcp",
    "dep:wg-backend",
    "plan-ai-auth/server",
]

[dependencies]
# Shared across client + server
dioxus = { version = "0.8.0-alpha.0", features = ["fullstack", "router"], optional = true }
dioxus-i18n = { version = "0.5", optional = true }
unic-langid = { version = "0.9", features = ["macros"], optional = true }
plan-ai-design = { path = "../design", optional = true }
plan-ai-auth = { path = "../common/plan-ai-auth" }
# Pinned to match wasm-bindgen-cli_0_2_121 in the flake devshell / package.
wasm-bindgen = { version = "=0.2.121", optional = true }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
schemars = { version = "1.2", features = ["derive", "uuid1"] }
uuid = { version = "1", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }

# Server-only
axum = { version = "0.8", optional = true }
tower = { version = "0.5", features = ["util"], optional = true }
tokio = { version = "1", features = ["full"], optional = true }
sqlx = { version = "0.8", features = ["runtime-tokio-rustls", "postgres", "uuid", "chrono"], optional = true }
async-trait = { version = "0.1", optional = true }
anyhow = { version = "1", optional = true }
thiserror = { version = "2", optional = true }
toml = { version = "0.8", optional = true }
tracing = { version = "0.1", optional = true }
tracing-subscriber = { version = "0.3", features = ["env-filter"], optional = true }
rustls = { workspace = true, optional = true }
x25519-dalek = { version = "2", features = ["static_secrets"], optional = true }
rand = { version = "0.8", optional = true }
base64 = { version = "0.22", optional = true }
ipnet = { version = "2", optional = true }
sha2 = { version = "0.10", optional = true }
aes-gcm = { version = "0.10", optional = true }
qrcode = { version = "0.14", default-features = false, features = ["svg"], optional = true }
plan-ai-html = { path = "../common/plan-ai-html", optional = true }
plan-ai-api-mcp = { path = "../common/plan-ai-api-mcp", optional = true }
wg-backend = { path = "../wg-backend", optional = true }

[target.'cfg(target_arch = "wasm32")'.dependencies]
getrandom = { version = "0.2", features = ["js"] }
uuid = { version = "1", features = ["js"] }

[dev-dependencies]
pgtemp = "0.7"
tokio = { version = "1", features = ["full"] }
