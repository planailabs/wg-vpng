# wg-vpng-server configuration. Copy to config.toml and point CONFIG_PATH at it
# (defaults to ./config.toml).

[database]
url = "postgres://localhost/wg-vpng"

[web]
port = 8080

# ── WireGuard ────────────────────────────────────────────────────────────
[wireguard]
# Backend that applies config to the real world. One of:
#   backend = "self-managed"     # kernel interface via wg + ip (needs CAP_NET_ADMIN)
#   backend = "network-manager"  # via nmcli + a keyfile connection profile
#   [wireguard.backend.mikrotik] # RouterOS REST API (see below)
backend = "self-managed"

interface_name = "wg0"
listen_port = 51820
# Server tunnel address (with prefix); peers are allocated from this subnet.
address = "10.8.0.1/24"
# Public host:port clients dial.
endpoint = "vpn.example.com:51820"
# DNS pushed to clients (optional).
dns = "10.8.0.1"
# Networks routed through the tunnel (client AllowedIPs).
allowed_ips = "10.8.0.0/24"
keepalive = 25

# MikroTik backend instead of self-managed:
# [wireguard.backend.mikrotik]
# url = "https://10.0.0.1"
# username = "admin"
# password = "..."
# insecure = true   # accept RouterOS's self-signed cert

# ── Auth (OIDC) ──────────────────────────────────────────────────────────
# Omit the whole [auth] section to disable web authentication (the bearer-token
# API still works). In debug builds, DEV_ONLY_NO_AUTH=1 also bypasses OIDC.
[auth]
cookie_secret = "generate-with: openssl rand -hex 32"
external_url = "https://vpn.example.com"
admin_emails = ["admin@example.com"]

[[auth.providers]]
slug = "google"
name = "Google"
issuer = "https://accounts.google.com"
client_id = "xxx.apps.googleusercontent.com"
client_secret = "GOCSPX-xxx"
allowed_domains = ["example.com"]
