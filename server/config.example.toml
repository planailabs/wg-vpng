# wg-vpng-server configuration. Copy to config.toml and point CONFIG_PATH at it
# (defaults to ./config.toml).
#
# Interfaces — and their per-interface backend (self-managed / NetworkManager /
# MikroTik), device limits, and access patterns — are created and managed
# entirely in the admin UI, not here.

[database]
url = "postgres://localhost/wg-vpng"

[web]
port = 8080

# ── Secrets ──────────────────────────────────────────────────────────────
# 32-byte key (base64 or hex) encrypting credentials stored in the database
# (e.g. a MikroTik password). Required only if you use a MikroTik backend.
# Generate with: openssl rand -base64 32
[secrets]
encryption_key = "REPLACE-with-openssl-rand-base64-32"

# ── Auth (OIDC) ──────────────────────────────────────────────────────────
# Omit the whole [auth] section to disable web authentication (the bearer-token
# API still works). In debug builds, DEV_ONLY_NO_AUTH=1 also bypasses OIDC.
[auth]
cookie_secret = "generate-with: openssl rand -hex 32"
external_url = "https://vpn.example.com"
admin_emails = ["admin@example.com"]

[[auth.providers]]
slug = "google"
name = "Google"
issuer = "https://accounts.google.com"
client_id = "xxx.apps.googleusercontent.com"
client_secret = "GOCSPX-xxx"
allowed_domains = ["example.com"]
# Optional: OIDC claim path holding the user's groups (e.g. "groups", "roles",
# "cognito:groups"). Its values are captured at login and matched against a
# group's `claim_values` (managed in the admin Groups page).
# groups_claim = "groups"
# Optional: days a login keeps the account "live" before it deactivates for
# inactivity (default 30; omit or 0 to never deactivate).
# liveliness_days = 30
